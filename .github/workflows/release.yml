name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Vendor check
        run: make vendor-check

      - name: Vet
        run: go vet ./...

      - name: Test (serial packages)
        run: go test -p 1 ./...

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Build from the committed vendor/ tree, and refuse to release if it
          # is not exactly what go.mod resolves to (no patch lives only in
          # vendor/; see .claude/rules/platform-build-and-flake-lessons.md §2).
          make vendor-check
          VERSION=${GITHUB_REF#refs/tags/v}
          LDFLAGS="-s -w -X main.appVersion=${VERSION}"
          EXT=""
          if [ "$GOOS" = "windows" ]; then
            EXT=".exe"
          fi

          # Build agnt (the primary binary)
          AGNT_OUTPUT="agnt-${GOOS}-${GOARCH}${EXT}"
          go build -ldflags="${LDFLAGS}" -o "${AGNT_OUTPUT}" ./cmd/agnt/

          # Create copies for other binaries (all are copies of agnt)
          cp "${AGNT_OUTPUT}" "devtool-mcp-${GOOS}-${GOARCH}${EXT}"
          cp "${AGNT_OUTPUT}" "agnt-daemon-${GOOS}-${GOARCH}${EXT}"
          cp "${AGNT_OUTPUT}" "devtool-mcp-daemon-${GOOS}-${GOARCH}${EXT}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            agnt-*
            devtool-mcp-*

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -name 'agnt-*' -exec cp {} release/ \;
          find artifacts -name 'devtool-mcp-*' -exec cp {} release/ \;
          # Checksums for the installers (install.sh / install.ps1) to verify
          # a download against before it replaces an installed binary.
          (cd release && sha256sum agnt-* devtool-mcp-* > SHA256SUMS)
          ls -la release/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/agnt-*
            release/devtool-mcp-*
            release/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish @standardbeagle/agnt to npm
        working-directory: npm/agnt
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for PyPI trusted publishing
    environment:
      name: pypi
      url: https://pypi.org/project/agnt/
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build agnt package
        working-directory: python/agnt
        run: python -m build

      - name: Publish agnt to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/agnt/dist/
